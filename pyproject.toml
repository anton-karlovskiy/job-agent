[project]
name = "job-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.12",
    "typer[all]",
    "rich",
    "pyyaml",
    "pypdf2",
    "python-dotenv",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "types-PyYAML",
    "ruff",
    "pytest>=9.0.3",
]

[project.scripts]
job-agent = "job_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
